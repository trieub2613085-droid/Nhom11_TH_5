<!DOCTYPE html>
<html lang="vi">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Infographic và Video</title>
	<style>
		body {
			font-family: Arial, sans-serif;
			max-width: 800px;
			margin: 40px auto;
			padding: 0 20px;
			background: #f5f5f5;
			color: #222;
		}
		header h1 {
			text-align: center;
			color: #2c3e50;
			margin-bottom: 40px;
		}
		section {
			background: #fff;
			padding: 20px;
			margin-bottom: 30px;
			border-radius: 10px;
			box-shadow: 0 2px 6px rgba(0,0,0,0.1);
		}
		section h2 {
			margin-top: 0;
			color: #34495e;
			border-bottom: 2px solid #eee;
			padding-bottom: 8px;
		}
		section p {
			color: #555;
			line-height: 1.6;
		}
		img, video {
			width: 100%;
			border-radius: 8px;
			margin-top: 10px;
			display: block;
		}
		footer {
			text-align: center;
			font-size: 13px;
			color: #888;
			margin-top: 40px;
			padding-top: 20px;
			border-top: 1px solid #ddd;
		}
	</style>
</head>
<body>
	<header>
		<h1>Infographic và Video</h1>
	</header>

	<main>
		<section>
			<h2>Infographic</h2>
			<p>Hình ảnh infographic cung cấp thông tin trực quan về chủ đề.</p>
			<img src="1.2 Infographic.png" alt="Infographic">
		</section>

		<section>
			<h2>Video</h2>
			<p>Video minh họa nội dung bằng hình ảnh và âm thanh.</p>
			<video controls>
				<source src="2.2 Video.mp4" type="video/mp4">
				Trình duyệt của bạn không hỗ trợ phát video MP4.
			</video>
		</section>
	</main>

	<footer>
		<p>Nội dung được tạo với sự hỗ trợ của GitHub Copilot (AI)</p>
	</footer>
</body>
</html>
